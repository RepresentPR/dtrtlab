<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — DTRT Lab</title>
  <meta name="description" content="Contact DTRT Lab.">
  <link rel="stylesheet" href="css/fonts.css?v=20261008e">
  <link rel="stylesheet" href="css/lab.css?v=20261008e">
  <link rel="stylesheet" href="css/adapt.css?v=20261008e">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/icon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://dtrtlab.com/contact.html">
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <section>
    <div class="wrap">
      <p class="kicker">Contact</p>
      <h2>Request access.</h2>
      <div class="actions">
        <a class="cta" href="mailto:DTRTCollision@outlook.com?subject=DTRT%20Lab%20access" data-event="Access">Email</a>
      </div>
      <form class="stack" id="contact-form" style="margin-top:40px">
        <label>Name <input name="name" autocomplete="name" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Subject
          <select name="category" required>
            <option value="playtest">Access</option>
            <option value="press">Press</option>
            <option value="business">Business</option>
            <option value="bug">Bug</option>
          </select>
        </label>
        <label>Message <textarea name="message" required maxlength="8000"></textarea></label>
        <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="cta" type="submit">Send</button>
        <p data-status class="note muted">Opens mail to DTRTCollision@outlook.com</p>
      </form>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script defer src="js/nav.js?v=20261010j"></script>
  <script defer src="js/forms.js?v=20261008e"></script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
DTRT.bindForm(document.getElementById("contact-form"));
});
</script>
</body>
</html>
