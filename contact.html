<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — DTRT Lab</title>
  <link rel="canonical" href="https://dtrtlab.com/contact.html">
  <link rel="stylesheet" href="/css/site.css?v=20261010c">
</head>
<body>
<header class="top">
  <a class="brand" href="/">DTRT Lab</a>
  <nav aria-label="Main">
    <a href="/clips/">Clips</a>
    <a href="/live/">Live</a>
    <a href="/partner/">Partner</a>
    <a href="/contact.html" aria-current="page">Contact</a>
    <a href="/radio.html">Radio</a>
    <a href="/versions/">Versions</a>
  </nav>
</header>
<main class="wrap">
  <h1>Contact</h1>
  <p>Email <a href="mailto:DTRTCollision@outlook.com">DTRTCollision@outlook.com</a>.</p>
  <section class="board">
    <article class="card pad"><h2>Highlight</h2><p>About a clip on the site.</p></article>
    <article class="card pad"><h2>Partner</h2><p>Sponsor ad or upload.</p></article>
    <article class="card pad"><h2>Website</h2><p>Something broken, or a question about the site.</p></article>
    <article class="card pad"><h2>Other</h2><p>Anything else.</p></article>
  </section>
  <form id="contact-form" class="card pad">
    <label>Category
      <select name="category" required>
        <option value="">Choose one</option>
        <option>Highlight</option>
        <option>Partner</option>
        <option>Website</option>
        <option>Other</option>
      </select>
    </label>
    <label>Subject <input name="subject" required></label>
    <label>Name <input name="name" autocomplete="name" required></label>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Message <textarea name="message" required></textarea></label>
    <button type="submit">Send email</button>
  </form>
</main>
<script>
document.getElementById("contact-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var data = new FormData(e.target);
  var category = String(data.get("category") || "");
  var subject = "[" + category + "] " + String(data.get("subject") || "");
  var body = "Category: " + category + "\nName: " + data.get("name") + "\nEmail: " + data.get("email") + "\n\n" + data.get("message");
  window.location.href = "mailto:DTRTCollision@outlook.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
});
</script>
</body>
</html>
