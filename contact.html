<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — DTRT Lab</title>
  <meta name="description" content="Contact DTRT Lab.">
  <link rel="stylesheet" href="css/fonts.css?v=20261010n">
  <link rel="stylesheet" href="css/lab.css?v=20261010n">
  <link rel="stylesheet" href="css/adapt.css?v=20261010n">





  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://dtrtlab.com/contact.html">
<link rel="icon" href="/img/brand/mark.svg?v=20261010n" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/brand/dtrt-avatar.png"><link rel="stylesheet" href="/css/identity.css?v=20261010n"><meta property="og:title" content="Contact — DTRT Lab"><meta property="og:description" content="Contact DTRT Lab."><meta property="og:url" content="https://dtrtlab.com/contact.html"><meta property="og:site_name" content="DTRT"><meta property="og:type" content="website"><meta property="og:image" content="https://dtrtlab.com/img/brand/dtrt-social.png"><meta name="twitter:card" content="summary_large_image"></head>
<body>
  <header class="nav" id="site-nav"></header>
  <section>
    <div class="wrap">
      <p class="kicker">Contact</p>
      <h1 class="page-heading">Let's talk.</h1>
      <div class="actions">
        <a class="cta" href="mailto:DTRTCollision@outlook.com?subject=DTRT%20enquiry" data-event="Access">Email</a>
      </div>
      <form class="stack" id="contact-form" style="margin-top:40px">
        <label>Name <input name="name" autocomplete="name" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Subject
          <select name="category" required>
            <option value="general">General enquiry</option><option value="playtest">Project access</option>
            <option value="press">Press</option>
            <option value="business">Business</option>
            <option value="bug">Bug</option>
          </select>
        </label>
        <label>Message <textarea name="message" required maxlength="8000"></textarea></label>
        <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="cta" type="submit">Open email draft</button>
        <p data-status class="note muted">Opens mail to DTRTCollision@outlook.com</p>
      </form>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script defer src="js/nav.js?v=20261010n"></script>
  <script defer src="js/forms.js?v=20261010n"></script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
DTRT.bindForm(document.getElementById("contact-form"));
});
</script>
<script src="/js/experience.js?v=20261010n" defer></script></body>
</html>
