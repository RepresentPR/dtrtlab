<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clips — DTRT Lab</title>
  <link rel="canonical" href="https://dtrtlab.com/clips/">
  <style>
    body { margin: 0; background: #F4F7FF; color: #1A1A1A; font: 16px/1.4 "Segoe UI", Helvetica, Arial, sans-serif; }
    a { color: #2F6BFF; text-decoration: none; }
    nav { display: flex; gap: 22px; padding: 18px 28px; font-size: 15px; }
    nav a:nth-child(2) { color: #FF5A5F; }
    nav a:nth-child(3) { color: #C4840A; }
    nav a:nth-child(4) { color: #2F6BFF; }
    main { max-width: 52rem; margin: 0 auto; padding: 12px 28px 80px; }
    h1 { margin: 12px 0 16px; font-size: clamp(36px, 5vw, 56px); font-weight: 650; letter-spacing: -0.03em; }
    video { width: 100%; background: #1A1A1A; border-radius: 12px; }
    button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin: 8px 0; padding: 10px; background: #fff; color: #1A1A1A; border: 0; border-radius: 12px; font: inherit; font-size: 18px; cursor: pointer; }
    button:hover, button:active, button[aria-current="true"] { filter: brightness(1.08); outline: 3px solid #2F6BFF; }
    img.thumb { width: 128px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; background: #1A1A1A; }
    li { list-style: none; }
    ul { margin: 20px 0 0; padding: 0; }
  </style>
</head>
<body>
<nav aria-label="Main">
  <a href="/">DTRT</a>
  <a href="/clips/" aria-current="page">Clips</a>
  <a href="/partner/">Partner</a>
  <a href="/contact.html">Contact</a>
  <a href="/live/">Live</a>
</nav>
<main>
  <h1>Lurk King</h1>
  <video id="player" controls playsinline preload="metadata"></video>
  <ul id="list">
    <li><button type="button" data-title="Lurk King">Lurk King</button></li>
    <li><button type="button" data-title="Skitz Ladder">Skitz Ladder</button></li>
    <li><button type="button" data-title="Somebody Said Rush B">Somebody Said Rush B</button></li>
    <li><button type="button" data-title="Come On, Code">Come On, Code</button></li>
    <li><button type="button" data-src="/watch/media/oh-my-god-i-am-so-slow.mp4" data-title="Oh my god, I am so slow"><img class="thumb" src="/img/thumbs/oh-my-god-i-am-so-slow.jpg" alt="">Oh my god, I am so slow</button></li>
    <li><button type="button" data-src="/watch/media/why-dont-you.mp4" data-title="Why don’t you don’t like that, bro"><img class="thumb" src="/img/thumbs/why-dont-you.jpg" alt="">Why don’t you don’t like that, bro</button></li>
    <li><button type="button" data-src="/watch/media/blind-by-black.mp4" data-title="Blind by black"><img class="thumb" src="/img/thumbs/blind-by-black.jpg" alt="">Blind by black</button></li>
    <li><button type="button" data-src="/watch/media/happened-to-you.mp4" data-title="Happened to you, bro"><img class="thumb" src="/img/thumbs/happened-to-you.jpg" alt="">Happened to you, bro</button></li>
    <li><button type="button" data-src="/watch/media/move-it.mp4" data-title="Move it"><img class="thumb" src="/img/thumbs/move-it.jpg" alt="">Move it</button></li>
    <li><button type="button" data-src="/watch/media/nice-literally-un-lucable.mp4" data-title="Nice, literally un-lucable"><img class="thumb" src="/img/thumbs/nice-literally-un-lucable.jpg" alt="">Nice, literally un-lucable</button></li>
    <li><button type="button" data-src="/watch/media/two-superpowers.mp4" data-title="Two superpowers"><img class="thumb" src="/img/thumbs/two-superpowers.jpg" alt="">Two superpowers</button></li>
    <li><button type="button" data-src="/watch/media/oh-what-a-lie.mp4" data-title="Oh, what a lie"><img class="thumb" src="/img/thumbs/oh-what-a-lie.jpg" alt="">Oh, what a lie</button></li>
  </ul>
</main>
<script>
(function () {
  var player = document.getElementById("player");
  var title = document.querySelector("h1");
  document.getElementById("list").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var src = btn.getAttribute("data-src");
    title.textContent = btn.getAttribute("data-title");
    if (src) {
      player.src = src;
      player.play();
    }
    Array.prototype.forEach.call(document.querySelectorAll("#list button"), function (b) {
      b.removeAttribute("aria-current");
    });
    btn.setAttribute("aria-current", "true");
  });
})();
</script>
</body>
</html>
