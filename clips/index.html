<script>
(function () {
  var player = document.getElementById("player");
  var title = document.getElementById("title");
  function choose(btn, play) {
    var src = btn.getAttribute("data-src");
    title.textContent = btn.getAttribute("data-title");
    if (src) {
      if (player.getAttribute("src") !== src) player.src = src;
      if (play) player.play();
    }
    document.querySelectorAll("#list button").forEach(function (b) { b.removeAttribute("aria-current"); });
    btn.setAttribute("aria-current", "true");
  }
  document.getElementById("list").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (btn) choose(btn, true);
  });
  var id = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (id) document.querySelectorAll("#list button").forEach(function (b) { if (b.getAttribute("data-id") === id) choose(b, false); });
})();
</script>
