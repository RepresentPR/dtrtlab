<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catalog — DTRT Lab</title>
  <meta name="description" content="DTRT Lab systems.">
  <link rel="stylesheet" href="css/fonts.css?v=20261010n">
  <link rel="stylesheet" href="css/lab.css?v=20261010n">
  <link rel="stylesheet" href="css/adapt.css?v=20261010n">





  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://dtrtlab.com/catalog.html">
<link rel="icon" href="/img/brand/mark.svg?v=20261010n" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/brand/dtrt-avatar.png"><link rel="stylesheet" href="/css/identity.css?v=20261010n"><meta property="og:title" content="Catalog — DTRT Lab"><meta property="og:description" content="DTRT Lab systems."><meta property="og:url" content="https://dtrtlab.com/catalog.html"><meta property="og:site_name" content="DTRT"><meta property="og:type" content="website"><meta property="og:image" content="https://dtrtlab.com/img/brand/dtrt-social.png"><meta name="twitter:card" content="summary_large_image"></head>
<body>
  <header class="nav" id="site-nav"></header>
  <section>
    <div class="wrap">
      <p class="kicker">Systems</p>
      <h1 class="page-heading">On the board.</h1>
      <div id="weapons"></div>
      <div id="modes" style="margin-top:24px"></div>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script defer src="js/nav.js?v=20261010n"></script>
  <script defer src="js/content.js?v=20261010n"></script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
    function row(item) {
      return "<tr><th>" + item.title + "</th><td>" + DTRT.statusLabel(item.status) + "</td></tr>";
    }
    DTRT.loadCatalog().then(function (c) {
      document.getElementById("weapons").innerHTML = "<table class='specs'>" + (c.weapons || []).map(row).join("") + "</table>";
      document.getElementById("modes").innerHTML = "<table class='specs'>" + (c.modes || []).map(row).join("") + "</table>";
    }).catch(function () {
      document.getElementById("weapons").innerHTML = '<p><a href="contact.html">Contact</a></p>';
    });

});
</script>
<script src="/js/experience.js?v=20261010n" defer></script></body>
</html>
