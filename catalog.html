<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catalog — DTRT Lab</title>
  <meta name="description" content="DTRT Lab systems.">
  <link rel="stylesheet" href="css/fonts.css?v=20261008e">
  <link rel="stylesheet" href="css/lab.css?v=20261008e">
  <link rel="stylesheet" href="css/adapt.css?v=20261008e">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/icon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://dtrtlab.com/catalog.html">
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <section>
    <div class="wrap">
      <p class="kicker">Systems</p>
      <h2>On the board.</h2>
      <div id="weapons"></div>
      <div id="modes" style="margin-top:24px"></div>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script defer src="js/nav.js?v=20261010j"></script>
  <script defer src="js/content.js?v=20261008e"></script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
    function row(item) {
      return "<tr><th>" + item.title + "</th><td>" + DTRT.statusLabel(item.status) + "</td></tr>";
    }
    DTRT.loadCatalog().then(function (c) {
      document.getElementById("weapons").innerHTML = "<table class='specs'>" + (c.weapons || []).map(row).join("") + "</table>";
      document.getElementById("modes").innerHTML = "<table class='specs'>" + (c.modes || []).map(row).join("") + "</table>";
    }).catch(function () {
      document.getElementById("weapons").innerHTML = '<p><a href="contact.html">Contact</a></p>';
    });
  
});
</script>
</body>
</html>
