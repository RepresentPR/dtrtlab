name: hq-refresh
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: hq-refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'RepresentPR/dtrtlab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet cryptography
      - name: Refresh aggregates
        env:
          LIVE_PASSWORD: ${{ secrets.LIVE_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: |
          if [ -z "$LIVE_PASSWORD" ]; then echo "LIVE_PASSWORD secret not set; skipping"; exit 0; fi
          python3 scripts/hq-refresh.py
      - name: Commit if changed
        run: |
          git config user.name "dtrt-hq-bot"; git config user.email "hq-bot@users.noreply.github.com"
          git add hq/owner.enc.json content/proof.json
          git diff --cached --quiet || (git commit -m "chore(hq): refresh aggregates" && git push)
