name: tests
# Runs the site test suites on every pull request and push to main.
# Jekyll is installed so the Pages branch-build test runs here; with
# DTRT_REQUIRE_JEKYLL set, that test fails instead of skipping.
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/pages/Gemfile
      DTRT_REQUIRE_JEKYLL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "20" }
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Node tests (with Jekyll)
        run: bundle exec node --test scripts/*.test.cjs
      - name: Node module tests
        run: node --test scripts/*.test.mjs
      - name: Python tests
        run: python3 -m unittest discover -s scripts -p 'test*.py'
