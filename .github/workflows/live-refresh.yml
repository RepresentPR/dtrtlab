name: live-refresh
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
permissions: {}   # least privilege: granted per job below
concurrency: { group: live-refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit the refreshed ciphertext + proof.json
    if: ${{ github.repository == 'RepresentPR/dtrtlab' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install --quiet 'cryptography==46.0.3'
      - name: Refresh aggregates
        env:
          LIVE_PASSWORD: ${{ secrets.LIVE_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: |
          if [ -z "$LIVE_PASSWORD" ]; then echo "::warning::LIVE_PASSWORD secret not set; skipping"; exit 0; fi
          python3 scripts/live-refresh.py
      - name: Commit if changed
        run: |
          git config user.name "dtrt-live-bot"; git config user.email "live-bot@users.noreply.github.com"
          git add live/owner.enc.json; if [ -f content/proof.json ]; then git add content/proof.json; fi
          git diff --cached --quiet || (git commit -m "chore(live): refresh aggregates" && git push)
