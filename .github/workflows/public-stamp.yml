name: public-stamp
# Pages publishes the main branch, so the committed stamp is what visitors see.
# This job writes a new Eastern date only when a public commit changed it.
# The commit touches the stamp line alone, so it cannot move the date again.
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: public-stamp
  cancel-in-progress: false
jobs:
  stamp:
    if: github.repository == 'RepresentPR/dtrtlab' && github.event.head_commit.message != 'chore(home): set the public stamp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Recompute the homepage stamp
        id: stamp
        run: node scripts/public-updated.cjs --apply-if-changed
      - name: Commit when the date changes
        if: steps.stamp.outputs.changed == 'true'
        run: |
          git config user.name "dtrt-stamp-bot"
          git config user.email "stamp-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore(home): set the public stamp"
          git push
