name: gates
# Durable copy + done gates (rules.md 8.1 and 8.4). The scripts live in the repo
# (scripts/gates/) so a box refresh cannot wipe them. Callable from deploy.yml.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # run_ci.sh runs scripts/gates/test_gates.py, then scripts/gates/copy_lint.py on
      # tracked drafts and scripts/gates/done_gate.py on tracked status files.
      - name: Gate tests + copy_lint + done_gate
        run: bash scripts/gates/run_ci.sh
