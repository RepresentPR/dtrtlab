<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highlights — DTRT Lab</title>
  <link rel="canonical" href="https://dtrtlab.com/">
  <style>
    body { margin: 0; background: #080808; color: #f4f1ea; font: 18px/1.45 Georgia, "Times New Roman", serif; }
    a { color: #f4f1ea; }
    header, main { max-width: 46rem; margin: 0 auto; padding: 20px; }
    nav a { margin-right: 16px; }
    video { width: 100%; background: #000; }
    button { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 10px 12px; background: #161616; color: #f4f1ea; border: 1px solid #333; font: inherit; cursor: pointer; }
    button[aria-current="true"] { border-color: #f4f1ea; }
  </style>
</head>
<body>
<header>
  <nav aria-label="Main">
    <a href="/" aria-current="page">Highlights</a>
    <a href="/partner/">Partner</a>
    <a href="/contact.html">Contact</a>
    <a href="/live/">Live</a>
  </nav>
</header>
<main>
  <h1>Highlights</h1>
  <p>Our clips are the highlight.</p>
  <video id="player" controls playsinline preload="metadata" src="/watch/media/oh-my-god-i-am-so-slow.mp4"></video>
  <p id="now-playing">Oh my god, I am so slow</p>
  <div id="list">
    <button type="button" data-src="/watch/media/oh-my-god-i-am-so-slow.mp4" aria-current="true">Oh my god, I am so slow</button>
    <button type="button" data-src="/watch/media/why-dont-you.mp4">Why don’t you don’t like that, bro</button>
    <button type="button" data-src="/watch/media/blind-by-black.mp4">Blind by black</button>
    <button type="button" data-src="/watch/media/happened-to-you.mp4">Happened to you, bro. This team is entirely so.</button>
    <button type="button" data-src="/watch/media/move-it.mp4">Move it</button>
    <button type="button" data-src="/watch/media/nice-literally-un-lucable.mp4">Nice, literally un-lucable</button>
    <button type="button" data-src="/watch/media/two-superpowers.mp4">The I think follow recall the two superpowers</button>
    <button type="button" data-src="/watch/media/oh-what-a-lie.mp4">Oh, what a lie</button>
  </div>
  <p>© 2026 DTRT Lab.</p>
</main>
<script>
(function () {
  var player = document.getElementById("player");
  var now = document.getElementById("now-playing");
  document.getElementById("list").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    player.src = btn.getAttribute("data-src");
    now.textContent = btn.textContent;
    Array.prototype.forEach.call(document.querySelectorAll("#list button"), function (b) {
      b.removeAttribute("aria-current");
    });
    btn.setAttribute("aria-current", "true");
    player.play();
  });
})();
</script>
</body>
</html>
