<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTRT Lab</title>
  <link rel="canonical" href="https://dtrtlab.com/">
  <style>
    :root { --bg: #12110f; --ink: #f6f1e7; --accent: #E8A317; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.2 "Segoe UI", Helvetica, Arial, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    nav { display: flex; gap: 28px; padding: 18px 28px; font-size: 14px; }
    .hero { padding: 8vh 6vw 4vh; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(56px, 9vw, 104px); font-weight: 500; letter-spacing: -0.045em; }
    .line { margin: 12px 0 0; color: var(--ink); font-size: 22px; }
    .blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 6vw 10vh; }
    .blocks a { display: flex; align-items: flex-end; min-height: 28vh; padding: 24px; background: #1c1a16; color: var(--accent); font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.03em; border-radius: 8px; }
    .blocks a:hover, .blocks a:active { background: var(--accent); color: #12110f; }
    @media (max-width: 700px) { .blocks { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav aria-label="Main">
  <a href="/clips/">Clips</a>
  <a href="/partner/">Partner</a>
  <a href="/contact.html">Contact</a>
  <a href="/live/">Live</a>
</nav>
<section class="hero">
  <h1>DTRT Lab</h1>
  <p class="line">Watch the clips.</p>
</section>
<section class="blocks" aria-label="Sections">
  <a href="/clips/">Clips</a>
  <a href="/partner/">Partner</a>
  <a href="/contact.html">Contact</a>
  <a href="/live/">Live</a>
</section>
</body>
</html>
