<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radio — DTRT Lab</title>
  <meta name="description" content="Afterlight radio. Seven cuts from the shop bench. Play, shuffle, volume.">
  <link rel="canonical" href="https://dtrtlab.com/radio.html">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/adapt.css">
  <link rel="stylesheet" href="css/afterlight.css">
  <link rel="icon" href="img/icon.svg">
</head>
<body>
  <a class="skip" href="#radio">Skip to radio</a>
  <header class="nav" id="site-nav"></header>
  <section id="radio">
    <div class="wrap">
      <p class="kicker">Afterlight</p>
      <h2>Radio</h2>
      <p>Seven cuts from the shop bench. Play them in order, shuffle the set, and turn the volume knob. Songs made for Isabella live on their own page.</p>
      <p><a href="isabella.html">Songs for Isabella</a></p>
      <div class="al-radio" id="al-radio">
        <audio id="al-radio-audio" preload="metadata"></audio>
        <div class="al-radio-now">
          <p class="n">Now</p>
          <h3 id="al-radio-now">—</h3>
          <p class="al-radio-time" id="al-radio-time">0:00 / 0:00</p>
          <input id="al-radio-seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        </div>
        <div class="al-radio-controls">
          <button type="button" id="al-radio-prev">Prev</button>
          <button type="button" id="al-radio-play" aria-pressed="false">Play</button>
          <button type="button" id="al-radio-next">Next</button>
          <button type="button" id="al-radio-shuffle" aria-pressed="false">Shuffle</button>
          <div class="al-radio-volwrap">
            <button type="button" class="al-radio-knob" id="al-radio-knob" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"></button>
            <span id="al-radio-vol">80%</span>
          </div>
        </div>
        <ol class="al-radio-list" id="al-radio-list"></ol>
      </div>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script src="js/nav.js"></script>
  <script src="js/radio.js"></script>
</body>
</html>
