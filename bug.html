<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bug — DTRT Lab</title>
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/adapt.css">
  <link rel="icon" href="img/icon.svg">
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <section>
    <div class="wrap">
      <p class="kicker">Bugs</p>
      <h2>Report.</h2>
      <form class="stack" id="bug-form">
        <label>Email <input name="email" type="email"></label>
        <label>What happened <textarea name="description" required></textarea></label>
        <input type="hidden" name="category" value="bug">
        <input class="hp" name="company" tabindex="-1" autocomplete="off">
        <button class="cta" type="submit">Send</button>
        <p data-status class="note muted">Opens mail to DTRTCollision@outlook.com</p>
      </form>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script src="js/nav.js"></script>
  <script src="js/forms.js"></script>
  <script>DTRT.bindForm(document.getElementById("bug-form"));</script>
</body>
</html>
