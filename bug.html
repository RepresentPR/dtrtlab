<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bug — DTRT Lab</title>
  <link rel="stylesheet" href="css/fonts.css?v=20261008e">
  <link rel="stylesheet" href="css/lab.css?v=20261008e">
  <link rel="stylesheet" href="css/adapt.css?v=20261008e">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/icon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://dtrtlab.com/bug.html">
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <section>
    <div class="wrap">
      <p class="kicker">Bugs</p>
      <h2>Report.</h2>
      <form class="stack" id="bug-form">
        <label>Email <input name="email" type="email"></label>
        <label>What happened <textarea name="description" required></textarea></label>
        <input type="hidden" name="category" value="bug">
        <input class="hp" name="company" tabindex="-1" autocomplete="off">
        <button class="cta" type="submit">Send</button>
        <p data-status class="note muted">Opens mail to DTRTCollision@outlook.com</p>
      </form>
    </div>
  </section>
  <footer id="site-foot"></footer>
  <script defer src="js/nav.js?v=20261010j"></script>
  <script defer src="js/forms.js?v=20261008e"></script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
DTRT.bindForm(document.getElementById("bug-form"));
});
</script>
</body>
</html>
