<style>

<div class="strip" id="strip"></div>
<p class="m">Counted automatically from our own records. A number appears only when it is measured; nothing is estimated.</p>
<p><a href="/">← Back to DTRT Lab</a> · <a href="/content/proof.json">Raw numbers (JSON)</a></p>
</main><script>
(async()=>{const r=await fetch('/content/proof.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();
const f=v=>v==null?null:v.toLocaleString('en-US');
const items=[['Posts published',d.posts_published],['Days building in public',d.days_running],['Total audience',d.audience_total]];
document.getElementById('strip').innerHTML=items.filter(i=>i[1]!=null).map(i=>`<div class="s"><strong>${f(i[1])}</strong><small>${i[0]}</small></div>`).join('');
document.getElementById('stamp').textContent='live · updated '+d.updated_et;})().catch(()=>{document.getElementById('stamp').textContent='live numbers unavailable right now'});
</script></body></html>
